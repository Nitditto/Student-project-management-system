services:
  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://server:4000
    depends_on:
      - server
    volumes:
      - ./client:/client
      - /client/node_modules
    stdin_open: true
    tty: true

  server:
    build: ./server
    container_name: server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./server:/server
      - /server/node_modules
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    command: http client:5173
    environment:
      NGROK_AUTHTOKEN: 3DPMjz7bOsjVehQBlKKhSZn1478_3X1mqWKCKBjqYcCakwXya
    ports:
      - "4040:4040"
    depends_on:
      - client

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data:
